name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-and-firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Python tests (protocol, OTA simulator, event fixture)
        run: python3 -m pytest -q tests/
      - name: Firmware host C tests (no vendor image needed)
        run: tools/check_all.sh --no-android --fw
      - name: Vendor image / emulator steps are skipped
        run: echo "The vendor firmware image is not in this repo, so image build and emulator checks only run locally."

  android-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests + debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
